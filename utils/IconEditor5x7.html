<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCD 5x7 Icon Editor</title>
    <style>
        :root {
            --bg: #232323;
            --panel: #191919;
            --cell: #0d0d0d;
            --cell-hover: #414141;
            --accent: #11a900;
            --accent-dark: #0d8100;
            --radius: 6px;
            --cell-size: 28px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--accent);
            font-family: "Courier New", Courier, monospace;
            user-select: none;
        }

        .toolbar,
        .output-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin: 5px 10px;
        }

        .outputs {
            display: flex;
            flex-direction: column;
        }

        .output-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2px 0;
        }

        .input {
            margin: 0;
            padding: 10px;
            border: none;
            border-radius: var(--radius);
            outline: none;
            background: var(--panel);
            color: var(--accent);
            font-family: "Courier New", Courier, monospace;
            font-size: 17px;
        }

        .input.small {
            padding: 5px 8px;
        }

        button.input {
            cursor: pointer;
        }

        button.input:hover {
            background: #141414;
        }

        #name_input {
            width: 100px;
        }

        #editor_cont {
            display: flex;
            justify-content: center;
            padding: 2px 5px;
        }

        .editor-cols {
            display: flex;
            flex-direction: row;
        }

        .editor-col {
            display: flex;
            flex-direction: column;
        }

        .box {
            position: relative;
            width: var(--cell-size);
            height: var(--cell-size);
            margin: 1px;
            cursor: pointer;
        }

        .box input {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
        }

        .mark {
            position: absolute;
            inset: 0;
            background: var(--cell);
        }

        .box:hover .mark {
            background: var(--cell-hover);
        }

        .box input:checked+.mark {
            background: var(--accent);
        }

        .code-out {
            width: min(800px, calc(100vw - 90px));
            min-height: 0;
            overflow: hidden;
            resize: none;
        }

        .output-wrap button {
            align-self: stretch;
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <input type="text" class="input small" id="name_input" value="icon" spellcheck="false" title="C variable name">
        <button type="button" class="input small" id="clear_btn">Clear</button>
    </div>

    <div id="editor_cont"></div>

    <div class="outputs">
        <div class="output-block">
            <div class="output-wrap">
                <textarea id="code_rows" class="input code-out" rows="1" spellcheck="false" readonly></textarea>
                <button type="button" class="input small" data-copy="code_rows">Copy</button>
            </div>
        </div>

        <div class="output-block">
            <div class="output-wrap">
                <textarea id="code_rows_array" class="input code-out" rows="1" spellcheck="false" readonly></textarea>
                <button type="button" class="input small" data-copy="code_rows_array">Copy</button>
            </div>
        </div>

        <div class="output-block">
            <div class="output-wrap">
                <textarea id="code_cols" class="input code-out" rows="1" spellcheck="false" readonly></textarea>
                <button type="button" class="input small" data-copy="code_cols">Copy</button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        const COLS = 5;
        const ROWS = 7;
        const refs = {};
        const pixels = [];
        let lastPaintedInput = null;

        document.addEventListener("DOMContentLoaded", () => {
            refs.name = document.getElementById("name_input");
            refs.editor = document.getElementById("editor_cont");
            refs.outputs = [
                document.getElementById("code_rows"),
                document.getElementById("code_rows_array"),
                document.getElementById("code_cols"),
            ];

            document.getElementById("clear_btn").addEventListener("click", clearEditor);
            document.querySelectorAll("[data-copy]").forEach(button => {
                button.addEventListener("click", () => copyOutput(button.dataset.copy));
            });
            refs.name.addEventListener("input", updateOutput);
            window.addEventListener("resize", resizeOutput);
            document.addEventListener("contextmenu", event => event.preventDefault());
            document.addEventListener("mouseup", () => { lastPaintedInput = null; });

            initEditor();
        });

        function initEditor() {
            const cols = document.createElement("div");
            cols.className = "editor-cols";

            for (let x = 0; x < COLS; ++x) {
                const col = document.createElement("div");
                col.className = "editor-col";
                pixels[x] = [];

                for (let y = 0; y < ROWS; ++y) {
                    const input = createPixel();
                    pixels[x][y] = input;
                    col.append(input.parentElement);
                }
                cols.append(col);
            }

            refs.editor.append(cols);
            updateOutput();
        }

        function createPixel() {
            const box = document.createElement("div");
            box.className = "box";

            const input = document.createElement("input");
            input.type = "checkbox";
            input.addEventListener("change", updateOutput);

            const mark = document.createElement("span");
            mark.className = "mark";
            mark.addEventListener("mousedown", event => paintPixel(event, input));
            mark.addEventListener("mouseenter", event => {
                if (event.buttons & 3) paintPixel(event, input);
            });

            box.append(input, mark);
            return input;
        }

        function paintPixel(event, input) {
            event.preventDefault();
            if (lastPaintedInput === input) return;

            input.checked = event.buttons !== 2;
            lastPaintedInput = input;
            updateOutput();
        }

        function clearEditor() {
            pixels.flat().forEach(input => { input.checked = false; });
            updateOutput();
        }

        function readBitmap() {
            const cols = Array(COLS).fill(0);
            const rows = Array(8).fill(0);

            for (let x = 0; x < COLS; ++x) {
                for (let y = 0; y < ROWS; ++y) {
                    if (!pixels[x][y].checked) continue;
                    cols[x] |= 1 << y;
                    rows[y] |= 1 << (COLS - 1 - x);
                }
            }
            return { cols, rows };
        }

        function formatBytes(bytes) {
            return bytes.map(value => `0x${value.toString(16).padStart(2, "0")}`).join(", ");
        }

        function rowsToUint64(rows) {
            let value = 0n;
            rows.forEach((row, i) => { value |= BigInt(row) << BigInt(i * 8); });
            return `0x${value.toString(16)}`;
        }

        function updateOutput() {
            const name = normalizeIdentifier(refs.name.value, "icon");
            const { cols, rows } = readBitmap();

            refs.outputs[0].value = `const uint64_t ${name} = ${rowsToUint64(rows)};`;
            refs.outputs[1].value = `const uint8_t ${name}[8] = {${formatBytes(rows)}};`;
            refs.outputs[2].value = `const uint8_t ${name}[5] = {${formatBytes(cols)}};`;
            resizeOutput();
        }

        function normalizeIdentifier(value, fallback) {
            let identifier = value.trim().replace(/[^a-zA-Z0-9_]/g, "_") || fallback;
            return /^[0-9]/.test(identifier) ? `_${identifier}` : identifier;
        }

        function resizeOutput() {
            refs.outputs.forEach(output => {
                output.style.height = "auto";
                output.style.height = `${output.scrollHeight}px`;
            });
        }

        function copyOutput(id) {
            navigator.clipboard.writeText(document.getElementById(id).value);
        }
    </script>
</body>

</html>
